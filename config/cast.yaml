# === 投稿ローテーション例 (1週間 / Path B 仕様) ===
posting_rotation_example:
  monday:
    evening_2130: { cast: black_cat, theme: "片思いの行方" }
  tuesday:
    morning_730: { cast: rabbit, theme: "今週の直感メッセージ" }
  wednesday:
    evening_2130: { cast: calico_cat, theme: "金運の流れ" }
  thursday:
    evening_2130: { cast: black_cat, theme: "あの人の本音" }
  friday:
    night_2300: { cast: owl, theme: "今週手放すべきもの" }
  saturday:
    night_2300: { cast: siamese, theme: "今あなたが選ぶべき道" }
  sunday:
    morning_730: { cast: black_cat, theme: "今日のメッセージ" }
# 猫族4本 / ゲスト3本 = 月間配分70%/30%と整合

# === ブランディング ===
account_branding:
  recommended_handle_examples:
    - "@uranai_doubutsuen"
    - "@uranai_zoo"
    - "@neko_uranai_kan"        # 「猫占い館」寄り
    - "@mofu_uranai"
  bio_template: |
    🖤🧡💜 占い動物園
    主は黒猫・三毛・シャムのタロット師たち
    ときどきうさぎ🐇 フクロウ🦉もゲスト鑑定
    結果はピン留めコメント👇
    ※エンタメ目的
  profile_image_strategy:
    - 主役の黒猫を中央
    - 周囲に三毛・シャムを配置 (三猫構図)
    - 他動物は bio や 動画で示唆

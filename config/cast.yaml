# 占い動物キャストの定義
# アカウントテーマ: 「占い動物園・主は猫族の家」
# 主軸 = 猫族 (3種) × タロット、ゲスト = 他動物 × 各専門ツール

# === 主役 ===
lead: black_cat                  # 黒猫がアカウントの顔。プロフ画像/サムネ統一感の中心
posting_share:                   # 月間投稿本数の目安配分
  # 猫族 (タロット担当・主軸 70%)
  black_cat: 0.30                # 主役・最頻出
  calico_cat: 0.20               # 三毛猫・金運/仕事担当
  siamese: 0.20                  # シャム猫・決断/キャリア担当
  # ゲスト動物 (各々の専門ツール・30%)
  rabbit: 0.10                   # うさぎ・パワーストーン
  owl: 0.10                      # フクロウ・星読み
  fox: 0.05                      # 狐・アンティーク鍵
  hedgehog: 0.03                 # ハリネズミ・ハーブ
  # 残り 0.02 は新ツール実験枠

# === 共通スタイル ===
shared:
  format: comment_driven_short
  duration_sec: 15
  end_signature: "鳴き声で締める"
  style_anchor: prompts/image_style_anchor.md
  visual_palette: "dark navy & gold mystical aesthetic"
  cuts_per_video: 4

# === 猫族キャスト (タロット担当・主軸) ===
cats:
  black_cat:
    jp: 黒猫
    en: Black Cat
    role: lead
    tool: tarot
    themes: [恋愛, 片思い, 復縁, あの人の本音, 運命, 結婚のタイミング]
    signature_sound: にゃおー
    sound_file: assets/se/cat_meow_black.wav
    sound_volume: 1.4
    sound_quality: "低めで神秘的・余韻長め"
    accent_color: "#C8A24A"       # antique gold
    persona_voice: "落ち着いた神秘的・少し気だるげ"
    voicevox_speaker_id: 16       # 九州そら (cool)
    image_prompt_file: prompts/image_cat_characters.md  # black section
    posting_time_recommend: "夜21:30 (主力CV枠)"
    tagline: "気まぐれな黒猫が、あなたの恋の一枚を引きます"
    hashtag: "#黒猫占い"
    asset_status: "8カット既存・即運用可"

  calico_cat:
    jp: 三毛猫
    en: Calico Cat
    role: support_cat
    tool: tarot
    themes: [金運, 仕事運, 幸運, 副業, 商売繁盛, 今週の運勢]
    signature_sound: にゃ!
    sound_file: assets/se/cat_meow_calico.wav
    sound_volume: 1.3
    sound_quality: "短く明るい・元気"
    accent_color: "#D9883B"       # warm orange-gold
    persona_voice: "明るく前向き・少しお茶目"
    voicevox_speaker_id: 8        # 春日部つむぎ (元気)
    image_prompt_file: prompts/image_cat_characters.md  # calico section
    posting_time_recommend: "夜21:30 (金運系) または 朝7:30 (今日の幸運)"
    tagline: "招き猫の三毛が、金運と幸運の一枚を選びます"
    hashtag: "#三毛猫占い"
    asset_status: "未生成・GPT Image 1で4カット作成必要"
    cultural_note: "招き猫の代表色 = 金運の象徴"

  siamese:
    jp: シャム猫
    en: Siamese Cat
    role: support_cat
    tool: tarot
    themes: [決断, キャリア, 転職, 進路, 選択, 人生の岐路]
    signature_sound: みゃおうっ
    sound_file: assets/se/cat_meow_siamese.wav
    sound_volume: 1.3
    sound_quality: "鋭く知的・短く言い切る"
    accent_color: "#3A3A6E"       # deep blue-violet
    persona_voice: "知的で凛とした・少し冷たい品位"
    voicevox_speaker_id: 47       # ナースロボ_タイプT (知的)
    image_prompt_file: prompts/image_cat_characters.md  # siamese section
    posting_time_recommend: "夜23:00 (深い決断テーマ)"
    tagline: "賢きシャムが、あなたの選ぶべき道を示します"
    hashtag: "#シャム猫占い"
    asset_status: "未生成・GPT Image 1で4カット作成必要"
    cultural_note: "王室で愛された賢明な猫種・神秘性と知性の象徴"


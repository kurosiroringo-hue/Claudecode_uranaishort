# 占い動物キャストの定義
# アカウントテーマ: 「占い動物園」
# 1アカウントで複数の動物が日替わりで占う。最後に鳴き声で締める = ブランドサウンド。

# === 主役 ===
lead: cat                        # 黒猫がアカウントの顔。プロフ画像/サムネ統一感の中心
posting_share:                   # 月間投稿本数の目安配分
  cat: 0.40                      # 4割を黒猫が担当 (主軸)
  rabbit: 0.15
  fox: 0.15
  owl: 0.10
  crow: 0.07
  hedgehog: 0.07
  shiba: 0.06

# === 共通スタイル ===
shared:
  format: comment_driven_short    # 短尺コメント誘導型 が標準
  duration_sec: 15
  end_signature: "鳴き声で締める"
  style_anchor: prompts/image_style_anchor.md
  visual_palette: "dark navy & gold mystical aesthetic"
  cuts_per_video: 4               # hook / setup / choose-zoom / meow-end の4枚

# === 現役キャスト ===
active:
  cat:
    jp: 黒猫占い師
    en: Black Cat Diviner
    role: lead                    # アカウントの主役
    signature_tool: tarot         # この動物の代名詞ツール (`config/tools.yaml`)
    compatible_tools: [tarot, candle, zodiac, key]   # この動物が扱えるツール一覧
    signature_sound: にゃおー
    sound_file: assets/se/cat_meow.wav
    sound_volume: 1.4
    accent_color: "#C8A24A"       # antique gold
    persona_voice: "落ち着いた神秘的・少し気だるげ"
    voicevox_speaker_id: 16       # 九州そら (cool)
    image_role_hint:
      hook: "口を大きく開けた近接、目力強い"
      meow: "口を大きく開けた近接 (にゃおーの瞬間)"
    tagline: "気まぐれな黒猫が、あなたへの一枚を引きます"
    hashtag: "#黒猫占い"

  rabbit:
    jp: 白うさぎ占い師
    en: White Rabbit Diviner
    role: support
    signature_tool: power_stone
    compatible_tools: [power_stone, herb, candle, flower]
    signature_sound: きゅうー
    sound_file: assets/se/rabbit_squeak.wav
    sound_volume: 1.2
    accent_color: "#E9D8E4"
    persona_voice: "やわらかく可愛らしい、少しふんわり"
    voicevox_speaker_id: 14       # 冥鳴ひまり
    image_role_hint:
      hook: "正面ロングショット、目を大きく見開く"
      meow: "鼻先アップ、口元が動くカット"
    tagline: "うさぎの直感が、あなたに合う一石を選びます"
    hashtag: "#うさぎ占い"

  fox:
    jp: 狐の占い師
    en: Fox Diviner
    role: support
    signature_tool: key
    compatible_tools: [key, tarot, rune, candle]
    signature_sound: コーン!
    sound_file: assets/se/fox_call.wav
    sound_volume: 1.3
    accent_color: "#8E1F2E"
    persona_voice: "凛として少しミステリアス・古風"
    voicevox_speaker_id: 8        # 春日部つむぎ (凛)
    image_role_hint:
      hook: "正面、和装の襟元見える、目に光"
      meow: "口を開けて鳴くカット"
    tagline: "古き鍵を持つ狐が、あなたの扉を選びます"
    hashtag: "#狐占い"

  owl:
    jp: フクロウ占い師
    en: Owl Diviner
    role: support
    signature_tool: moon          # 月相占い (3つの月相から選ぶ)
    compatible_tools: [moon, scroll, rune, candle]
    signature_sound: ホー、ホー
    sound_file: assets/se/owl_hoot.wav
    sound_volume: 1.2
    accent_color: "#3A4A6E"
    persona_voice: "静かで知的・諭すように"
    voicevox_speaker_id: 9        # 波音リツ (静)
    image_role_hint:
      hook: "金色の目を見開いた近接、首をやや傾ける"
      meow: "口を僅かに開けて鳴くカット"
    tagline: "夜の賢者が、あなたへの月のメッセージを"
    hashtag: "#フクロウ占い"
    posting_time_recommend: "22:00以降の深夜帯"

  crow:
    jp: カラス占い師
    en: Raven Diviner
    role: support
    signature_tool: rune          # ルーン文字3つから選ぶ
    compatible_tools: [rune, scroll, key]
    signature_sound: カァー
    sound_file: assets/se/crow_caw.wav
    sound_volume: 1.3
    accent_color: "#1F2027"
    persona_voice: "重く厳かな・断定しすぎない警告調"
    voicevox_speaker_id: 11       # 玄野武宏
    image_role_hint:
      hook: "片目だけアップ、羽根のディテール"
      meow: "嘴を開けて鳴くカット"
    tagline: "古き渡り鳥が、あなたへのルーンを運びます"
    hashtag: "#カラス占い"
    posting_time_recommend: "22:00以降、シリアス系テーマ"

  hedgehog:
    jp: ハリネズミ占い師
    en: Hedgehog Diviner
    role: support
    signature_tool: herb          # ハーブ/ドライフラワー3束から選ぶ
    compatible_tools: [herb, flower, power_stone, nut]   # nut = 木の実占い
    signature_sound: フンッ
    sound_file: assets/se/hedgehog_sniff.wav
    sound_volume: 1.0             # 小動物なので控えめ
    accent_color: "#9C7B5C"       # warm beige
    persona_voice: "小さく優しい・ささやくよう"
    voicevox_speaker_id: 14       # 冥鳴ひまり (やわらか)
    image_role_hint:
      hook: "鼻先のアップ、針の質感"
      meow: "鼻をひくつかせる仕草"
    tagline: "小さなハリネズミが、あなたへの一葉を選びます"
    hashtag: "#ハリネズミ占い"
    posting_time_recommend: "朝7:30〜の癒し枠"

  shiba:
    jp: 柴犬占い師
    en: Shiba Diviner
    role: support
    signature_tool: omikuji       # おみくじ・お守り3つから選ぶ (和風)
    compatible_tools: [omikuji, key, herb]
    signature_sound: ワン!
    sound_file: assets/se/shiba_bark.wav
    sound_volume: 1.4
    accent_color: "#D9883B"       # shiba orange
    persona_voice: "明るく前向き・元気"
    voicevox_speaker_id: 3        # ずんだもん代替: WhiteCUL等の明るい声
    image_role_hint:
      hook: "舌を出して笑顔、片耳がピン"
      meow: "口を開けてワン!"
    tagline: "元気な柴犬が、あなたへの一札を選びます"
    hashtag: "#柴犬占い"
    posting_time_recommend: "朝・昼の親しみやすい枠"

# === 投稿ローテーション例 (1日3本) ===
posting_rotation_example:
  monday:
    morning_730: { cast: hedgehog, tool: herb, theme: "今日の癒しメッセージ" }
    evening_2130: { cast: cat, tool: tarot, theme: "片思いの行方" }
    night_2300: { cast: owl, tool: moon, theme: "近々訪れる変化" }
  tuesday:
    morning_730: { cast: rabbit, tool: power_stone, theme: "対人関係のヒント" }
    evening_2130: { cast: cat, tool: candle, theme: "金運の流れ" }
    night_2300: { cast: crow, tool: rune, theme: "今手放すべきもの" }
  wednesday:
    morning_730: { cast: shiba, tool: omikuji, theme: "今日の運勢" }
    evening_2130: { cast: cat, tool: tarot, theme: "復縁の可能性" }
    night_2300: { cast: fox, tool: key, theme: "次の扉" }

# === ブランディング ===
account_branding:
  recommended_handle_examples:
    - "@uranai_doubutsuen"
    - "@uranai_zoo"
    - "@mofu_uranai"
  bio_template: |
    🐈🐇🦊🦉🐦🦔🐕 占い動物園
    主役は黒猫
    タロット/星座/パワーストーン/キャンドル… 視覚で楽しむ3択占い
    結果はピン留めコメント👇
    本格鑑定はリンクから #PR
    ※エンタメ目的
  profile_image_strategy:
    - 黒猫 hook カットを基本にして他動物は脇に小さく配置
    - もしくは黒猫を中央、周囲に他動物のシルエットで「動物園」感を出す

# 占い動物キャストの定義
# アカウントテーマ: 「占い動物園・主は猫族の家」
# 主軸 = 猫族 (3種) × タロット、ゲスト = 他動物 × 各専門ツール

# === 主役 ===
lead: black_cat                  # 黒猫がアカウントの顔。プロフ画像/サムネ統一感の中心
posting_share:                   # 月間投稿本数の目安配分
  # 猫族 (タロット担当・主軸 70%)
  black_cat: 0.30                # 黒猫・恋愛 (本音/運命) 担当・主役
  white_cat: 0.20                # 白猫・恋愛 (癒し/浄化/結婚) 担当
  calico_cat: 0.20               # 三毛猫・金運/仕事/キャリア決断 担当 (主砲)
  # ゲスト動物 (各々の専門ツール・30%)
  rabbit: 0.10                   # うさぎ・パワーストーン (癒し)
  owl: 0.10                      # フクロウ・星読み (深夜)
  fox: 0.05                      # 狐・アンティーク鍵 (転機)
  shiba: 0.05                    # 柴犬・おみくじ (ライト系・親しみ枠)
  # 30%消化、新ツール実験枠なし

# === 共通スタイル ===
shared:
  format: comment_driven_short
  duration_sec: 15
  end_signature: "鳴き声で締める"
  style_anchor: prompts/image_style_anchor.md
  visual_palette: "dark navy & gold mystical aesthetic"
  cuts_per_video: 4

# === 猫族キャスト (タロット担当・主軸) ===
cats:
  black_cat:
    jp: 黒猫
    en: Black Cat
    role: lead
    tool: tarot
    themes: [恋愛の本音, 片思いの行方, 復縁の可能性, あの人の気持ち, 運命の人, 二人の今後]
    theme_genre: 恋愛 (本音・運命系)
    signature_sound: にゃおー
    sound_file: assets/se/cat_meow_black.wav
    sound_volume: 1.4
    sound_quality: "低めで神秘的・余韻長め"
    accent_color: "#C8A24A"       # antique gold
    background_palette: "dark navy + antique gold (mystery)"
    persona_voice: "落ち着いた神秘的・少し気だるげ"
    voicevox_speaker_id: 16       # 九州そら (cool)
    image_prompt_file: prompts/image_cat_characters.md  # black section
    posting_time_recommend: "夜21:30 (主力CV枠)"
    tagline: "気まぐれな黒猫が、あなたの恋の本音を引き出します"
    hashtag: "#黒猫占い"
    asset_status: "8カット既存・Kling動画10秒成功"

  white_cat:
    jp: 白猫
    en: White Cat
    role: support_cat
    tool: tarot
    themes: [癒し恋愛, 自己肯定, 失恋からの回復, 結婚のタイミング, 縁結び, 心の浄化]
    theme_genre: 恋愛 (癒し・浄化系)
    signature_sound: みゃう
    sound_file: assets/se/cat_meow_white.wav
    sound_volume: 1.1
    sound_quality: "高く透明・優しく短い"
    accent_color: "#E9D8E4"       # soft pink-cream
    background_palette: "soft pink + cream + lavender (healing)"
    persona_voice: "やわらかく天使のよう・包み込むトーン"
    voicevox_speaker_id: 14       # 冥鳴ひまり (やわらか)
    image_prompt_file: prompts/image_cat_characters.md  # white section
    posting_time_recommend: "朝7:30 (癒し枠) または 夜21:30 (恋愛サブ枠)"
    tagline: "やさしい白猫が、あなたの恋を癒す一枚を選びます"
    hashtag: "#白猫占い"
    asset_status: "1カット既存 (hookのみ)・setup/meowを生成必要"
    cultural_note: "純潔・癒し・天使の象徴。失恋層・自己肯定層の支持を狙う"

  calico_cat:
    jp: 三毛猫
    en: Calico Cat
    role: support_cat_main_revenue   # M4¥300K commit の主砲
    tool: tarot
    themes: [金運, 仕事運, 幸運, 副業, 商売繁盛, キャリアの決断, 転職の時期, 進路の選択]
    theme_genre: 金運・仕事 (キャリア決断含む拡張)
    signature_sound: にゃ!
    sound_file: assets/se/cat_meow_calico.wav
    sound_volume: 1.3
    sound_quality: "短く明るい・元気"
    accent_color: "#D9883B"       # warm orange-gold
    background_palette: "gold + amber (招福・warm)"
    persona_voice: "明るく前向き・少しお茶目"
    voicevox_speaker_id: 8        # 春日部つむぎ (元気)
    image_prompt_file: prompts/image_cat_characters.md  # calico section
    posting_time_recommend: "夜21:30 (金運系・主力CV枠) または 昼12:00 (キャリア層)"
    tagline: "招き猫の三毛が、金運と新しい一歩の一枚を選びます"
    hashtag: "#三毛猫占い"
    asset_status: "1カット既存 (hookのみ)・setup/meowを生成必要"
    cultural_note: "招き猫の代表色 = 金運の象徴。A8電話占い (キャリア・お金相談) の主動線"

# === ゲスト動物キャスト (専門ツール・30%) ===

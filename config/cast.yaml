    sound_volume: 1.2
    accent_color: "#E9D8E4"
    persona_voice: "やわらかく可愛らしい"
    voicevox_speaker_id: 14       # 冥鳴ひまり
    posting_time_recommend: "朝7:30 (癒し枠)"
    tagline: "うさぎの直感が、あなたに合う一石を選びます"
    hashtag: "#うさぎ占い"
    asset_status: "1カット既存・動画化済"
    guest_appearance_share: 0.10

  owl:
    jp: フクロウ占い師
    en: Owl Diviner
    tool: zodiac
    themes: [今週の運勢, 12星座, 手放し, 月のサイクル]
    signature_sound: ホー、ホー
    sound_file: assets/se/owl_hoot.wav
    sound_volume: 1.2
    accent_color: "#3A4A6E"
    persona_voice: "静かで知的・諭すように"
    voicevox_speaker_id: 9        # 波音リツ
    posting_time_recommend: "深夜23:00"
    tagline: "夜の賢者が、あなたへの星のメッセージを"
    hashtag: "#フクロウ占い"
    asset_status: "10カットストーリー既存・動画化済"
    guest_appearance_share: 0.10

  fox:
    jp: 狐の占い師
    en: Fox Diviner
    tool: key
    themes: [人生の節目, 転機, 新しい扉]
    signature_sound: コーン!
    sound_file: assets/se/fox_call.wav
    sound_volume: 1.3
    accent_color: "#8E1F2E"
    persona_voice: "凛として古風"
    voicevox_speaker_id: 8
    posting_time_recommend: "夜21:30 (人生決断テーマ)"
    hashtag: "#狐占い"
    asset_status: "3カット既存・追加生成推奨"
    guest_appearance_share: 0.05

  shiba:
    jp: 柴犬占い師
    en: Shiba Inu Diviner
    tool: omikuji
    themes: [今日の運勢, 対人運, 家族運, 友情, 親しみやすい運勢]
    theme_genre: ライト系・庶民派 (親しみやすさ・対人)
    signature_sound: ワン!
    sound_file: assets/se/shiba_bark.wav
    sound_volume: 1.4
    sound_quality: "明るく短く、元気な一声"
    accent_color: "#D9883B"        # shiba orange
    background_palette: "warm cream + shiba orange + soft gold (親しみ・和風モダン)"
    persona_voice: "明るく前向き・少し体育会系"
    voicevox_speaker_id: 3
    posting_time_recommend: "昼12:00 (ライト枠) または 朝7:30 (今日の運勢)"
    hashtag: "#柴犬占い"
    asset_status: "未生成 (GPT Image 1で要制作)"
    guest_appearance_share: 0.05
    cultural_note: |
      Shiba Inu は世界レベルで認知度最高の犬種 (#shiba は数千万ヒット)。
      猫族の「神秘・深い」トーンと対比的に「明るい・親しみやすい」トーン
      を担当。占いコンテンツが重くなりすぎないバランサー役。海外リーチ
      にも強い。Doge meme 文化の波及効果も期待可能。

# === 将来追加候補 ===
roadmap:
  siamese:
    jp: シャム猫
    tool: tarot
    themes: [深い決断, 内面の知性, 哲学的選択]
    signature_sound: みゃおうっ
    accent_color: "#3A3A6E"       # deep blue-violet
    note: |
      議題6で白猫に主軸枠を譲り、roadmap に移動。
      フォロワー1万到達後の「シャム猫デビュー」特別感ある投入を検討。
      担当テーマは「キャリア決断」を三毛猫と差別化するため、
      「人生の哲学的選択」「深い内面探求」など、より思索的な領域に設定。
  brown_tabby:
    jp: 茶トラ
    tool: tarot
    themes: [対人, 友情, 家族]
    signature_sound: にゃ〜ん
    note: "Stage 2 で追加検討"
  crow:
    jp: カラス占い師
    tool: rune
    note: "深夜枠の補強として、フクロウとの差別化が確立してから"
  hedgehog:
    jp: ハリネズミ占い師
    tool: herb
    signature_sound: フンッ
    note: |
      議題7で柴犬に枠を譲り roadmap に移動。検索ボリュームの低さが課題。
      フォロワー1万到達後の「マイナーキャラ枠」として復活余地あり。
  panda:
    jp: パンダ占い師
    tool: herb (笹/竹)
    note: "Stage 3で世界展開時の海外リーチ強化候補"

# === 投稿ローテーション例 (1週間 / 黒・白・三毛 + ゲスト) ===
posting_rotation_example:
  monday:
    evening_2130: { cast: black_cat, theme: "片思いの行方" }
  tuesday:
    morning_730: { cast: white_cat, theme: "今週の心の癒し" }
  wednesday:
    evening_2130: { cast: calico_cat, theme: "金運の流れ" }
  thursday:
    evening_2130: { cast: black_cat, theme: "あの人の本音" }
  friday:
    night_2300: { cast: owl, theme: "今週手放すべきもの" }
  saturday:
    evening_2130: { cast: white_cat, theme: "結婚のタイミング" }
  sunday:
    morning_730: { cast: calico_cat, theme: "今週の幸運" }
# 黒猫2 / 白猫2 / 三毛猫2 / フクロウ1 = 月間配分70%/30%と整合

# === ブランディング ===
account_branding:
  recommended_handle_examples:
    - "@uranai_doubutsuen"
    - "@uranai_zoo"
    - "@neko_uranai_kan"        # 「猫占い館」寄り
    - "@mofu_uranai"
  bio_template: |
    🖤🤍🧡 占い動物園・主は猫族の家
    黒猫=恋愛/白猫=癒し/三毛猫=金運
    ときどきうさぎ🐇 フクロウ🦉もゲスト鑑定
    結果はピン留めコメント👇

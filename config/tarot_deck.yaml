    visual_en: "a regal woman crowned with stars, seated in a lush garden of wheat, a heart-shaped shield with venus symbol"
    upright_keywords: [豊かさ, 母性, 創造, 受容]
    reversed_keywords: [依存, 停滞, 過保護]
    short_message: "受け取る豊かさを、ありがたく抱きしめて"


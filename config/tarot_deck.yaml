# タロット 大アルカナ22枚 メタデータ
#
# 動画素材として使うオリジナル22枚カードは assets/tarot_deck/major/ に配置。
# ファイル命名は {id_2桁}_{en_snake_case}.jpg (例: 18_moon.jpg)。
# 高解像度のグッズ用は major_hires/ に PNG で保管。
# 詳細は assets/tarot_deck/README.md 参照。
#
# cat_featured: そのカードに描かれている猫種 (動画台本でキャラの自然な
# ペアリングに使う)。確定済の4枚以外は判明し次第埋める。
#
# 小アルカナ56枚は将来必要に応じて追加。

major:
  - id: 0
    en: The Fool
    jp: 愚者
    image_file: assets/tarot_deck/major/00_fool.jpg
    image_file_hires: assets/tarot_deck/major_hires/00_fool@4x.png
    cat_featured: brown_tabby            # 茶トラ (旅人風)
    visual_en: "a youthful figure stepping off a cliff edge with a small dog at heels, holding a white rose, sun behind"
    visual_jp: "茶トラの猫が魔法使いの帽子と星の袋を持ち、夕日の道へ踏み出す"
    upright_keywords: [始まり, 自由, 純粋, 可能性]
    reversed_keywords: [軽率, 無計画, 迷い]
    short_message: "新しい一歩を踏み出す勇気が、あなたを導きます"

  - id: 1
    en: The Magician
    jp: 魔術師
    image_file: assets/tarot_deck/major/01_magician.jpg
    image_file_hires: assets/tarot_deck/major_hires/01_magician@4x.png
    cat_featured: black_and_white_cat            # ハチワレ (魔法使いの装い)
    visual_en: "a robed figure with one hand pointing up to the sky and one to the earth, infinity symbol overhead, four suit symbols on the table"
    upright_keywords: [創造, 意志, 始動, 才能]
    reversed_keywords: [策略, 未熟, 機会喪失]
    short_message: "あなたの中の才能を信じて動き出す時"

  - id: 2
    en: The High Priestess
    jp: 女教皇
    image_file: assets/tarot_deck/major/02_high_priestess.jpg
    image_file_hires: assets/tarot_deck/major_hires/02_high_priestess@4x.png
    cat_featured: siamese            # シャム猫 (女教皇=神秘・直感とぴったり)
    visual_en: "a serene robed priestess seated between two pillars, crescent moon at feet, a scroll partially hidden"
    upright_keywords: [直感, 知恵, 内省, 神秘]
    reversed_keywords: [秘密, 知識不足, 浅慮]
    short_message: "答えはあなたの心の奥に静かに眠っています"


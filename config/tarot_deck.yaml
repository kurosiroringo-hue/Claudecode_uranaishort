# === cat_featured の取りうる値 ===
# 主要カテゴリ (占い師キャラと対応):
# black_cat           : 黒猫 (主役・恋愛系担当)
# white_cat           : 白猫
# calico_cat          : 三毛猫 (金運担当)
# brown_tabby         : 茶トラ (オレンジタビー)
# siamese             : シャム猫 (決断担当)
#
# 単独柄バリエ:
# gray_cat            : 単色グレー (ロシアンブルー風)
# gray_tabby          : グレーのタビー (縞模様)
# cream_cat           : クリーム色 (薄ベージュ系)
# gray_white_cat      : グレーと白の混合
#
# 複合:
# black_and_white_cat : ハチワレ または 黒猫+白猫 のペア
# multi_cats          : 3匹以上が登場 (戦車カード等)
# no_cat              : 猫が描かれていない (風景や象徴のみ)
# TBD                 : 未確定
